name: Build iOS (unsigned IPA)

# Builds an unsigned .ipa for sideloading (AltStore / SideStore re-sign it with your own Apple ID).
# Run it by hand: Actions tab -> "Build iOS (unsigned IPA)" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26 # Xcode 26+ is required by Expo SDK 58 (Swift 6.2)
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8 # CocoaPods needs a UTF-8 terminal
      CI: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check Xcode version
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          test "$major" -ge 26 || { echo "Xcode 26 or newer is required"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Quizkit.xcworkspace \
            -scheme Quizkit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Quizkit.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1

      - name: Show the end of the build log on failure
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/xcodebuild.log" || true

      - name: Package the .ipa
        run: |
          set -e
          app="$RUNNER_TEMP/Quizkit.xcarchive/Products/Applications/Quizkit.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Quizkit-${GITHUB_SHA::7}.ipa" Payload)
          ls -lh Quizkit-*.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: quizkit-ios-unsigned-ipa
          path: Quizkit-*.ipa
          retention-days: 14
          if-no-files-found: error
