<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Quizkit" />
    <!-- These two hrefs must start with expo.experiments.baseUrl from app.json (Expo does not prefix template links). Guarded by src/web/__tests__/indexHtml.test.ts. -->
    <link rel="manifest" href="/quizkit/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/quizkit/apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }
      html,
      body {
        background-color: #f6f7f9; /* tokens.ts light bg; the app also sets it at runtime */
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #101216; /* tokens.ts dark bg */
        }
      }
      body {
        overflow: hidden;
      }
      /* Fixed to the full screen so the installed app also covers the notch and home-indicator areas. */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
      }
    </style>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
